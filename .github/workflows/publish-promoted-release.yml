name: Publish Promoted Release

run-name: >-
  Publish promoted release from
  ${{ inputs.promotion_sha || github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promotion_sha:
        description: Full protected-main promotion commit SHA to publish or reconcile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-promoted-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  classify:
    name: Classify protected main update
    if: >-
      github.repository == 'HMG-AI/HMG-public' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      promotion_commit: ${{ steps.contract.outputs.promotion_commit }}
      publish: ${{ steps.contract.outputs.publish }}
    steps:
      - name: Check out protected main history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect a complete promotion contract
        id: contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_PROMOTION_SHA: ${{ inputs.promotion_sha }}
        run: bash .github/scripts/classify-promoted-release.sh

  publish:
    name: Verify and publish immutable release
    needs: classify
    if: >-
      github.repository == 'HMG-AI/HMG-public' &&
      github.ref == 'refs/heads/main' &&
      needs.classify.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment:
      name: hmg-public-release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the reviewed publisher control code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: publisher-control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the promoted commit as data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.classify.outputs.promotion_commit }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify provenance and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_COMMIT: ${{ needs.classify.outputs.promotion_commit }}
          PROMOTION_WORKTREE: ${{ github.workspace }}/candidate
        run: bash publisher-control/.github/scripts/publish-promoted-release.sh
