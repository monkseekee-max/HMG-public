name: Publish Promoted Release

run-name: Publish promoted release from ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-promoted-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  publish:
    name: Verify and publish draft
    if: >-
      github.repository == 'HMG-AI/HMG-public' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read promotion contract
        id: promotion
        env:
          PROMOTION_COMMIT: ${{ github.sha }}
        run: |
          trailer_file="${RUNNER_TEMP}/promotion-trailers.txt"
          git show -s --format=%B "${PROMOTION_COMMIT}" \
            | git interpret-trailers --parse > "${trailer_file}"

          mapfile -t source_tags < <(
            sed -nE 's/^HMG-Source-Tag:[[:space:]]*//p' "${trailer_file}"
          )
          mapfile -t source_shas < <(
            sed -nE 's/^HMG-Source-SHA:[[:space:]]*//p' "${trailer_file}"
          )
          mapfile -t asset_set_digests < <(
            sed -nE 's/^HMG-Asset-Set-SHA256:[[:space:]]*//p' "${trailer_file}"
          )
          mapfile -t source_repositories < <(
            sed -nE 's/^HMG-Source-Repository:[[:space:]]*//p' "${trailer_file}"
          )
          mapfile -t workflow_runs < <(
            sed -nE 's/^HMG-Workflow-Run:[[:space:]]*//p' "${trailer_file}"
          )

          recognized_count="$(
            grep -Ec '^HMG-(Source-Tag|Source-SHA|Asset-Set-SHA256|Source-Repository|Workflow-Run):' \
              "${trailer_file}" || true
          )"
          if ((recognized_count == 0)); then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ((
            recognized_count != 5 ||
            ${#source_tags[@]} != 1 ||
            ${#source_shas[@]} != 1 ||
            ${#asset_set_digests[@]} != 1 ||
            ${#source_repositories[@]} != 1 ||
            ${#workflow_runs[@]} != 1
          )); then
            echo "Promotion commits must contain exactly one of each required HMG trailer." >&2
            exit 1
          fi

          source_tag="${source_tags[0]}"
          source_sha="${source_shas[0]}"
          asset_set_digest="${asset_set_digests[0]}"
          source_repository="${source_repositories[0]}"
          workflow_run="${workflow_runs[0]}"
          if [[ ! "${source_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid HMG-Source-Tag: ${source_tag}" >&2
            exit 1
          fi
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid HMG-Source-SHA." >&2
            exit 1
          fi
          if [[ ! "${asset_set_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid HMG-Asset-Set-SHA256." >&2
            exit 1
          fi
          if [[ "${source_repository}" != "HMG-AI/HMG" ]]; then
            echo "HMG-Source-Repository must be HMG-AI/HMG." >&2
            exit 1
          fi
          if [[ ! "${workflow_run}" =~ ^https://github\.com/HMG-AI/HMG/actions/runs/[1-9][0-9]*$ ]]; then
            echo "Invalid HMG-Workflow-Run." >&2
            exit 1
          fi

          {
            echo "publish=true"
            echo "source_tag=${source_tag}"
            echo "source_sha=${source_sha}"
            echo "asset_set_digest=${asset_set_digest}"
            echo "source_repository=${source_repository}"
            echo "workflow_run=${workflow_run}"
          } >> "${GITHUB_OUTPUT}"

      - name: Record ordinary main push no-op
        if: steps.promotion.outputs.publish == 'false'
        env:
          PROMOTION_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "### Promoted release publisher"
            echo
            echo "No HMG promotion trailers were present on ${PROMOTION_COMMIT}."
            echo "No release was changed."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify protected promotion pull request
        id: provenance
        if: steps.promotion.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_COMMIT: ${{ github.sha }}
          SOURCE_TAG: ${{ steps.promotion.outputs.source_tag }}
        run: |
          associated_pulls="${RUNNER_TEMP}/associated-pulls.json"
          expected_head="release/hmg-public/${SOURCE_TAG}"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/commits/${PROMOTION_COMMIT}/pulls" \
            > "${associated_pulls}"

          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg expected_head "${expected_head}" '
              length == 1 and
              .[0].state == "closed" and
              .[0].merged_at != null and
              .[0].base.ref == "main" and
              .[0].base.repo.full_name == $repository and
              .[0].head.repo.full_name == $repository and
              .[0].head.ref == $expected_head
            ' "${associated_pulls}" >/dev/null

          pull_number="$(jq -r '.[0].number' "${associated_pulls}")"
          pull_url="$(jq -r '.[0].html_url' "${associated_pulls}")"
          if [[ ! "${pull_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Associated promotion pull request number is invalid." >&2
            exit 1
          fi
          {
            echo "pull_number=${pull_number}"
            echo "pull_url=${pull_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify repository release metadata
        if: steps.promotion.outputs.publish == 'true'
        env:
          SOURCE_TAG: ${{ steps.promotion.outputs.source_tag }}
        run: |
          version="${SOURCE_TAG#v}"
          if [[ ! -f VERSION ]]; then
            echo "VERSION is missing." >&2
            exit 1
          fi
          if ! cmp -s VERSION <(printf '%s\n' "${version}"); then
            echo "VERSION does not match ${SOURCE_TAG}." >&2
            exit 1
          fi

          manifest_version="$(
            jq -er '.product.version | select(type == "string")' public-manifest.json
          )"
          if [[ "${manifest_version}" != "${version}" ]]; then
            echo "public-manifest.json product.version does not match ${SOURCE_TAG}." >&2
            exit 1
          fi

      - name: Inspect draft release and exact asset set
        id: release
        if: steps.promotion.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.promotion.outputs.source_tag }}
        run: |
          version="${SOURCE_TAG#v}"
          release_json="${RUNNER_TEMP}/release.json"
          expected_assets="${RUNNER_TEMP}/expected-assets.txt"
          actual_assets="${RUNNER_TEMP}/actual-assets.txt"
          asset_snapshot="${RUNNER_TEMP}/release-assets.json"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${SOURCE_TAG}" \
            > "${release_json}"

          jq -e --arg tag "${SOURCE_TAG}" '
            .tag_name == $tag and
            .draft == true and
            .prerelease == false and
            (.id | type == "number")
          ' "${release_json}" >/dev/null

          cat > "${expected_assets}" <<EOF
          SHA256SUMS.txt
          hmg-${version}-aarch64-apple-darwin.tar.gz
          hmg-${version}-aarch64-pc-windows-msvc.zip
          hmg-${version}-aarch64-unknown-linux-gnu.tar.gz
          hmg-${version}-x86_64-apple-darwin.tar.gz
          hmg-${version}-x86_64-pc-windows-msvc.zip
          hmg-${version}-x86_64-unknown-linux-gnu.tar.gz
          install.ps1
          install.sh
          version.json
          EOF
          LC_ALL=C sort -o "${expected_assets}" "${expected_assets}"
          jq -r '.assets[].name' "${release_json}" \
            | LC_ALL=C sort > "${actual_assets}"
          diff -u "${expected_assets}" "${actual_assets}"

          jq -e '
            (.assets | length) == 10 and
            all(.assets[]; .state == "uploaded" and .size > 0)
          ' "${release_json}" >/dev/null
          jq -S '
            [.assets[] | {id, name, size, state, updated_at, digest}]
            | sort_by(.name)
          ' "${release_json}" > "${asset_snapshot}"

          release_id="$(jq -r '.id' "${release_json}")"
          if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "Draft release id is invalid." >&2
            exit 1
          fi
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

      - name: Download and verify release assets
        id: assets
        if: steps.promotion.outputs.publish == 'true'
        env:
          EXPECTED_ASSET_SET_DIGEST: ${{ steps.promotion.outputs.asset_set_digest }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.promotion.outputs.source_tag }}
        run: |
          version="${SOURCE_TAG#v}"
          asset_dir="${RUNNER_TEMP}/release-assets"
          expected_assets="${RUNNER_TEMP}/expected-assets.txt"
          downloaded_assets="${RUNNER_TEMP}/downloaded-assets.txt"
          expected_packages="${RUNNER_TEMP}/expected-packages.txt"
          checksummed_packages="${RUNNER_TEMP}/checksummed-packages.txt"
          asset_set_unsorted="${RUNNER_TEMP}/asset-set.unsorted"
          asset_set_manifest="${RUNNER_TEMP}/asset-set.sha256"

          rm -rf "${asset_dir}"
          mkdir -p "${asset_dir}"
          gh release download "${SOURCE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${asset_dir}"

          entry_count="$(
            find "${asset_dir}" -mindepth 1 -maxdepth 1 | wc -l
          )"
          if ((entry_count != 10)); then
            echo "Downloaded release directory does not contain exactly 10 entries." >&2
            exit 1
          fi
          find "${asset_dir}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "${downloaded_assets}"
          diff -u "${expected_assets}" "${downloaded_assets}"

          cat > "${expected_packages}" <<EOF
          hmg-${version}-aarch64-apple-darwin.tar.gz
          hmg-${version}-aarch64-pc-windows-msvc.zip
          hmg-${version}-aarch64-unknown-linux-gnu.tar.gz
          hmg-${version}-x86_64-apple-darwin.tar.gz
          hmg-${version}-x86_64-pc-windows-msvc.zip
          hmg-${version}-x86_64-unknown-linux-gnu.tar.gz
          EOF
          LC_ALL=C sort -o "${expected_packages}" "${expected_packages}"

          checksum_file="${asset_dir}/SHA256SUMS.txt"
          last_byte="$(
            tail -c 1 "${checksum_file}" | od -An -t u1 | tr -d '[:space:]'
          )"
          if [[ "${last_byte}" != "10" ]]; then
            echo "SHA256SUMS.txt must end with a newline." >&2
            exit 1
          fi
          mapfile -t checksum_lines < "${checksum_file}"
          if ((${#checksum_lines[@]} != 6)); then
            echo "SHA256SUMS.txt must contain exactly six package checksums." >&2
            exit 1
          fi
          checksum_line_pattern='^[0-9a-f]{64}  ([A-Za-z0-9._-]+)$'
          : > "${checksummed_packages}"
          for checksum_line in "${checksum_lines[@]}"; do
            if [[ ! "${checksum_line}" =~ ${checksum_line_pattern} ]]; then
              echo "SHA256SUMS.txt is not in canonical GNU sha256sum format." >&2
              exit 1
            fi
            printf '%s\n' "${BASH_REMATCH[1]}" >> "${checksummed_packages}"
          done
          LC_ALL=C sort -o "${checksummed_packages}" "${checksummed_packages}"
          diff -u "${expected_packages}" "${checksummed_packages}"
          (
            cd "${asset_dir}"
            sha256sum --strict --check SHA256SUMS.txt
          )

          jq -e -s --arg tag "${SOURCE_TAG}" --arg version "${version}" '
            length == 1 and
            (.[0] | type == "object") and
            (.[0] | keys | sort) == ([
              "channel",
              "manifest_version",
              "message",
              "released_at",
              "severity",
              "sha256sums_url",
              "tag",
              "title",
              "update_command",
              "version"
            ] | sort) and
            .[0].manifest_version == 1 and
            .[0].version == $version and
            .[0].tag == $tag and
            (.[0].released_at | type == "string") and
            (.[0].released_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
            .[0].channel == "stable" and
            .[0].severity == "normal" and
            .[0].title == ("HMG " + $tag + " available") and
            .[0].message == "Run hmg update to install the latest HMG release." and
            .[0].update_command == "hmg update" and
            .[0].sha256sums_url == "https://github.com/HMG-AI/HMG-public/releases/latest/download/SHA256SUMS.txt"
          ' "${asset_dir}/version.json" >/dev/null

          : > "${asset_set_unsorted}"
          while IFS= read -r asset_name; do
            asset_digest="$(
              sha256sum "${asset_dir}/${asset_name}" | cut -d ' ' -f 1
            )"
            printf '%s  %s\n' "${asset_digest}" "${asset_name}" \
              >> "${asset_set_unsorted}"
          done < "${expected_assets}"
          LC_ALL=C sort -k2 "${asset_set_unsorted}" > "${asset_set_manifest}"
          computed_asset_set_digest="$(
            sha256sum "${asset_set_manifest}" | cut -d ' ' -f 1
          )"
          if [[ "${computed_asset_set_digest}" != "${EXPECTED_ASSET_SET_DIGEST}" ]]; then
            echo "The canonical 10-asset digest does not match the promotion trailer." >&2
            exit 1
          fi
          echo "computed_asset_set_digest=${computed_asset_set_digest}" \
            >> "${GITHUB_OUTPUT}"

      - name: Re-check and publish draft release
        if: steps.promotion.outputs.publish == 'true'
        env:
          ASSET_SET_DIGEST: ${{ steps.assets.outputs.computed_asset_set_digest }}
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR_URL: ${{ steps.provenance.outputs.pull_url }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
          SOURCE_TAG: ${{ steps.promotion.outputs.source_tag }}
          WORKFLOW_RUN: ${{ steps.promotion.outputs.workflow_run }}
        run: |
          current_release="${RUNNER_TEMP}/release-current.json"
          current_snapshot="${RUNNER_TEMP}/release-assets-current.json"
          exact_tag_ref="${RUNNER_TEMP}/exact-tag-ref.json"
          matching_tag_refs="${RUNNER_TEMP}/matching-tag-refs.json"
          published_response="${RUNNER_TEMP}/release-publish-response.json"
          published_release="${RUNNER_TEMP}/release-published.json"
          published_snapshot="${RUNNER_TEMP}/release-assets-published.json"
          final_tag_ref="${RUNNER_TEMP}/final-tag-ref.json"
          latest_release="${RUNNER_TEMP}/latest-release.json"

          resolve_tag_commit() {
            local object_type="$1"
            local object_sha="$2"
            local annotated_tag

            for _ in 1 2 3 4 5; do
              case "${object_type}" in
                commit)
                  printf '%s\n' "${object_sha}"
                  return 0
                  ;;
                tag)
                  annotated_tag="${RUNNER_TEMP}/annotated-tag-${object_sha}.json"
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                    > "${annotated_tag}"
                  object_type="$(jq -r '.object.type' "${annotated_tag}")"
                  object_sha="$(jq -r '.object.sha' "${annotated_tag}")"
                  ;;
                *)
                  echo "Release tag points to unsupported object type: ${object_type}" >&2
                  return 1
                  ;;
              esac
            done
            echo "Annotated release tag nesting is too deep." >&2
            return 1
          }

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > "${current_release}"
          jq -e --arg tag "${SOURCE_TAG}" --argjson id "${RELEASE_ID}" '
            .id == $id and
            .tag_name == $tag and
            .draft == true and
            .prerelease == false
          ' "${current_release}" >/dev/null
          jq -S '
            [.assets[] | {id, name, size, state, updated_at, digest}]
            | sort_by(.name)
          ' "${current_release}" > "${current_snapshot}"
          diff -u "${RUNNER_TEMP}/release-assets.json" "${current_snapshot}"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${SOURCE_TAG}" \
            > "${matching_tag_refs}"
          jq --arg ref "refs/tags/${SOURCE_TAG}" \
            '[.[] | select(.ref == $ref)]' \
            "${matching_tag_refs}" > "${exact_tag_ref}"
          exact_tag_count="$(jq 'length' "${exact_tag_ref}")"
          if ((exact_tag_count == 0)); then
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${SOURCE_TAG}" \
              -f "sha=${GITHUB_SHA}" \
              > "${exact_tag_ref}"
          elif ((exact_tag_count == 1)); then
            jq '.[0]' "${exact_tag_ref}" > "${exact_tag_ref}.single"
            mv "${exact_tag_ref}.single" "${exact_tag_ref}"
          else
            echo "More than one exact release tag ref was returned." >&2
            exit 1
          fi
          jq -e --arg ref "refs/tags/${SOURCE_TAG}" '
            .ref == $ref and
            (.object.sha | type == "string") and
            (.object.type | type == "string")
          ' "${exact_tag_ref}" >/dev/null
          tag_object_type="$(jq -r '.object.type' "${exact_tag_ref}")"
          tag_object_sha="$(jq -r '.object.sha' "${exact_tag_ref}")"
          prepublish_tag_commit="$(
            resolve_tag_commit "${tag_object_type}" "${tag_object_sha}"
          )"
          if [[ "${prepublish_tag_commit}" != "${GITHUB_SHA}" ]]; then
            # target_commitish is ignored for an existing tag. Advance only when
            # GitHub can prove this is a non-forced fast-forward to main.
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SOURCE_TAG}" \
              -f "sha=${GITHUB_SHA}" \
              -F force=false \
              > "${exact_tag_ref}"
            tag_object_type="$(jq -r '.object.type' "${exact_tag_ref}")"
            tag_object_sha="$(jq -r '.object.sha' "${exact_tag_ref}")"
            prepublish_tag_commit="$(
              resolve_tag_commit "${tag_object_type}" "${tag_object_sha}"
            )"
            if [[ "${prepublish_tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Release tag could not be advanced to the promotion commit." >&2
              exit 1
            fi
          fi

          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f "make_latest=true" \
            -f "target_commitish=${GITHUB_SHA}" \
            > "${published_response}"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > "${published_release}"
          jq -e --arg tag "${SOURCE_TAG}" --argjson id "${RELEASE_ID}" '
            .id == $id and
            .tag_name == $tag and
            .draft == false and
            .prerelease == false
          ' "${published_release}" >/dev/null
          jq -S '
            [.assets[] | {id, name, size, state, updated_at, digest}]
            | sort_by(.name)
          ' "${published_release}" > "${published_snapshot}"
          diff -u "${RUNNER_TEMP}/release-assets.json" "${published_snapshot}"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/latest" \
            > "${latest_release}"
          jq -e --argjson id "${RELEASE_ID}" '.id == $id' \
            "${latest_release}" >/dev/null

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SOURCE_TAG}" \
            > "${final_tag_ref}"
          jq -e --arg ref "refs/tags/${SOURCE_TAG}" '.ref == $ref' \
            "${final_tag_ref}" >/dev/null
          final_object_type="$(jq -r '.object.type' "${final_tag_ref}")"
          final_object_sha="$(jq -r '.object.sha' "${final_tag_ref}")"
          final_tag_commit="$(
            resolve_tag_commit "${final_object_type}" "${final_object_sha}"
          )"
          if [[ "${final_tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Published release tag does not resolve to the promotion commit." >&2
            exit 1
          fi

          release_url="$(jq -r '.html_url' "${published_release}")"
          {
            echo "### Promoted release published"
            echo
            echo "- Release: [${SOURCE_TAG}](${release_url})"
            echo "- Promotion PR: [reviewed source-tree change](${PROMOTION_PR_URL})"
            echo "- Promotion commit: ${GITHUB_SHA}"
            echo "- Source commit: ${SOURCE_SHA}"
            echo "- Source workflow: [trusted run](${WORKFLOW_RUN})"
            echo "- 10-asset digest: ${ASSET_SET_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
